# 配信設定。h3 daemon start が読む。

resolution: 768p            # 768p | 1080p
aspect_ratio: "16:9"
chunk_seconds: 10           # Director のチャンク長（生成先行分の推定に使う）
memory: 20                  # Director の memory（過去プロンプト保持数）

queue_low_sec: 12           # 音声キュー残がこれ未満で h3 wait が queue_low を返す（生成先行 ≒10 秒 + 余裕）
lead_target_sec: 18         # 目安：生成先行 10 秒 + 1 発話 8 秒
session_max_min: 6          # Director セッション上限。実測は session_info.max_session_seconds（約 6.2 分）で、より短い方が使われる
restart_warn_min: 1         # 残りこれ以下で h3 wait が session_ending を返す
voice_mode: tts             # tts | native

# 配信に乗せる音声の出どころ（docs/SPEC.md §5.1）。
#   tts_direct: Director の音声トラックはゲイン 0（口パクの条件付け専用）にして、
#               TTS の wav を compositor 内で直接再生する。音質が元 wav のまま保たれる。
#   director:   Director が返す音声トラックをそのまま流す（モデルが再合成するので劣化する）。
audio_source: tts_direct
audio_offset_ms: 0          # tts_direct の再生時刻の補正（ms）。正で遅らせる

# YouTube の初回ポーリングは過去のコメントも全部返すので、
# デーモン起動時刻より前に投稿されたコメントは未使用バッファに入れず捨てる。
ignore_comments_before_start: true

endpoint: minimax/h3-max/director

ports:
  api: 8777                 # CLI 向けローカル HTTP API / ビューワー / オーバーレイ（127.0.0.1）
  host: 127.0.0.1

# OpenAI 互換の音声合成 API（POST {base_url}/v1/audio/speech）。
# サーバーはこのリポジトリの管理外。別途立てておく（.claude/skills/h3-stream-setup/SKILL.md §6）。
# 鍵が要るサーバーなら .env の TTS_API_KEY に書く。
# キャラごとに別のサーバーを使うなら characters/<name>/voice/tts.yaml の base_url が優先される。
tts:
  base_url: http://127.0.0.1:8020
  request_timeout_sec: 120   # 合成 1 回のタイムアウト
  ping_timeout_sec: 5        # 起動時の疎通確認（GET /v1/models → /health）のタイムアウト

# ここより config/youtube.yaml が優先される（auth / broadcast_id などはあちらで設定する）。
youtube:
  enabled: false
  client_secret_path: ./config/client_secret.json
  token_path: ./state/youtube_token.json
  broadcast_id: ""
  poll_interval_ms: 5000
  ng_words:
    - 死ね
    - 殺す

# 自前送出（SPEC §8）。headless Chromium で /compositor を開き、
# そこから届く webm を ffmpeg で H.264/AAC にして RTMP へ流す。
broadcast:
  enabled: false            # true: headless Chromium + ffmpeg を起動して送出する
  preview: false             # enabled が false でも Chromium だけ起動して合成を回す（ffmpeg 無し）
  output: rtmp              # rtmp | file（file はローカル確認用に file_path へ書く）
  rtmp_url: rtmp://a.rtmp.youtube.com/live2   # ストリームキーは .env の RTMP_KEY
  file_path: ./state/preview.flv
  encoder: auto             # auto | nvenc | x264（auto は ffmpeg -encoders で判定）
  video_bitrate_k: 4500
  audio_bitrate_k: 160
  fps: 30
  width:                    # 空なら resolution から決める（768p/720p→1280x720, 1080p→1920x1080）
  height:
  headless: true
  gpu: false                # Chromium に GPU を使わせる（使える環境なら true）
  chunk_ms: 500             # MediaRecorder の timeslice
  record_director_audio: false  # Director 音声トラックだけを別録りして state/analysis に残す（口パクのずれ計測用）

# --direction の禁止語（SPEC §3.1）。単純な部分一致（大文字小文字は無視）。
# 1 つでも当たったら speak / direct は送信せず direction_blocked を返す。
# 誤爆すると発話が止まるので、演出として普通に書きたくなる語は入れない。
direction_blocklist:
  # 画面外に出る・構図を変える
  - out of frame
  - off screen
  - offscreen
  - off-screen
  - outside the frame
  - leaves the frame
  - leaves the shot
  - exits the frame
  - steps out of frame
  - she walks away
  - she runs away
  - walks off
  - turns her back
  - facing away from the camera
  - close-up
  - closeup
  - extreme close
  - crops tighter
  - cropped
  - cuts away
  - cut away from her
  # 別人物
  - another person
  - another character
  - another girl
  - another woman
  - second character
  - second person
  - a new character
  - different person
  - someone else appears
  - a man appears
  - clone of her
  - her sister
  # 画面上のテキスト・UI
  - text on screen
  - on-screen text
  - on screen text
  - text appears
  - subtitle
  - caption
  - chat window
  - comment feed
  - ui overlay
  - logo overlay
  - watermark
  - speech bubble
  - title card
  # キャラ本人（服・帽子・眼鏡・ヘッドホン・髪・顔）を変える
  - changes her outfit
  - changes her clothes
  - changes clothes
  - new outfit
  - different outfit
  - different clothes
  - takes off her cap
  - removes her cap
  - without her cap
  - takes off her hat
  - removes her hat
  - takes off her glasses
  - removes her glasses
  - without her glasses
  - takes off her headphones
  - removes her headphones
  - takes off her jacket
  - changes her hair
  - changes her hairstyle
  - different hairstyle
  - new hairstyle
  - hair color
  - dyes her hair
  - her hair turns
  - glowing cap
  - glowing hair
  - her cap glows
  - her hair glows
  - her glasses glow

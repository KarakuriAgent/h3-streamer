<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>h3-stream viewer</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #05070d; color: #dfe7f5; font: 13px/1.6 system-ui, sans-serif; }
      header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: #0b111c; }
      h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: 0.04em; }
      #status { color: #7fd0ff; }
      button { background: #1b64d3; color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
      button[disabled] { background: #2a3550; cursor: default; }
      main { display: grid; grid-template-columns: 1fr 320px; gap: 12px; padding: 12px 16px; }
      video { width: 100%; background: #000; border-radius: 8px; aspect-ratio: 16 / 9; }
      #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11px; color: #93a3bd;
             background: #0b111c; border-radius: 8px; padding: 10px; height: 60vh; overflow: auto; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1>h3-stream viewer</h1>
      <span id="status">connecting…</span>
      <button id="start">音声を再生</button>
    </header>
    <main>
      <video id="stage" autoplay playsinline muted></video>
      <pre id="log"></pre>
    </main>
    <script type="module" src="/static/viewer.js"></script>
  </body>
</html>
